name: Build Book Haven APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Configure Android, Logo, Internet & Build APK
        run: |
          rm -rf android pubspec.lock
          cp lib/database/db_factory_stub.dart lib/database/db_factory.dart
          rm -f lib/database/db_factory_web.dart
          sed -i '/sqflite_common_ffi_web/d' pubspec.yaml
          sed -i '/sqlite3:/d' pubspec.yaml
          flutter create --platforms=android --org com.muhammadusman.bookhaven .
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="Book Haven"/g' android/app/src/main/AndroidManifest.xml
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          cp web/icons/Icon-512.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp web/icons/Icon-512.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp web/icons/Icon-512.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp web/icons/Icon-512.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp web/icons/Icon-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          flutter pub get
          flutter build apk --release --split-per-abi --no-tree-shake-icons

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Book-Haven-APK
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
