name: Build Book Haven APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build APK
        run: |
          rm -rf android pubspec.lock
          cp lib/database/db_factory_stub.dart lib/database/db_factory.dart
          rm -f lib/database/db_factory_web.dart
          sed -i '/sqflite_common_ffi_web/d' pubspec.yaml
          sed -i '/sqlite3:/d' pubspec.yaml
          flutter create --platforms=android --org com.muhammadusman.bookhaven .
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="Book Haven"/g' android/app/src/main/AndroidManifest.xml
          pip install pillow
          python3 -c "
          from PIL import Image, ImageDraw
          import glob
          s = 512
          img = Image.new('RGBA', (s, s), (0, 0, 0, 0))
          d = ImageDraw.Draw(img)
          d.rounded_rectangle([0, 0, s-1, s-1], radius=int(s*0.24), fill=(14, 107, 99, 255))
          d.polygon([(int(0.17*s), int(0.36*s)), (int(0.48*s), int(0.40*s)), (int(0.48*s), int(0.78*s)), (int(0.17*s), int(0.74*s))], fill=(255, 255, 255, 255))
          d.polygon([(int(0.83*s), int(0.36*s)), (int(0.52*s), int(0.40*s)), (int(0.52*s), int(0.78*s)), (int(0.83*s), int(0.74*s))], fill=(255, 255, 255, 255))
          d.line([(int(0.20*s), int(0.30*s)), (int(0.50*s), int(0.12*s)), (int(0.80*s), int(0.30*s))], fill=(242, 169, 59, 255), width=int(s*0.075), joint='curve')
          for p in glob.glob('android/app/src/main/res/mipmap-*/ic_launcher*.png'):
              img.save(p)
          "
          flutter pub get
          flutter build apk --release --split-per-abi --no-tree-shake-icons

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Book-Haven-APK
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
